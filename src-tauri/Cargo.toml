[package]
name = "chubao-win-ai"
version = "0.3.0"
description = "Windows 本地 AI 自动化控制工具"
authors = ["chubao"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 低内存构建优化 (7.8GB RAM)
[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
strip = true
panic = "abort"
